<div id="chat-container" class="chat-container">
  <div class="chat-header">
    <h5 id="header">
      Chatting with siga<span
        ><h6 id="typingMessage" class="typing-message">
          siga is typing ...
        </h6></span
      >
    </h5>
    <div class="typing-indicator" id="typingIndicator">
      <div class="inner-container">
        <div class="dots-container">
          <span class="point"></span>
          <span class="point"></span>
          <span class="point"></span>
        </div>
      </div>
    </div>
    <div class="exit" id="exit">x</div>
  </div>
  <div class="chat-box" id="chatBox"></div>
  <form id="sendMsg" class="message-form">
    <div class="message-container">
      <textarea
        name="message"
        id="msgContent"
        class="message-input"
        placeholder="Message"
      ></textarea>
      <button id="submitBtn" class="send-button" type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path
            d="M16.1 260.2c-22.6 12.9-20.5 47.3 3.6 57.3L160 376l0 103.3c0 18.1 14.6 32.7 32.7 32.7c9.7 0 18.9-4.3 25.1-11.8l62-74.3 123.9 51.6c18.9 7.9 40.8-4.5 43.9-24.7l64-416c1.9-12.1-3.4-24.3-13.5-31.2s-23.3-7.5-34-1.4l-448 256zm52.1 25.5L409.7 90.6 190.1 336l1.2 1L68.2 285.7zM403.3 425.4L236.7 355.9 450.8 116.6 403.3 425.4z"
          />
        </svg>
      </button>
    </div>
  </form>
</div>
