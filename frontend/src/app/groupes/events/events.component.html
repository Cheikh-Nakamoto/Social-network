<app-toolbar></app-toolbar>
<div class="groupe-form-container">
  <h2>Créer un nouvel événement</h2>

  <form [formGroup]="groupeForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="groupName">Nom de l'événement</label>
      <input id="groupName" formControlName="name" type="text" class="form-control" />
      <div *ngIf="groupeForm.get('name')?.invalid && groupeForm.get('name')?.touched" class="error-message">
        Le nom de l'événement est requis et ne doit pas dépasser 50 caractères.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" class="form-control"></textarea>
      <div *ngIf="groupeForm.get('description')?.invalid && groupeForm.get('description')?.touched"
        class="error-message">
        La description est requise et ne doit pas dépasser 250 caractères.
      </div>
    </div>

    <div class="form-group">
      <div class="form-group">
        <!-- Date de début -->
        <mat-form-field>
          <input matInput [matDatepicker]="startDatePicker" placeholder="Start Date" formControlName="hour_start">
          <mat-datepicker #startDatePicker></mat-datepicker>
        </mat-form-field>

        <!-- Heure de début -->
        <mat-form-field>
          <input matInput [ngxTimepicker]="startTimePicker" placeholder="Start Time" formControlName="hour_start">
          <ngx-material-timepicker #startTimePicker></ngx-material-timepicker>
        </mat-form-field>
      </div>

      <div class="form-group">
        <!-- Date de fin -->
        <mat-form-field>
          <input matInput [matDatepicker]="endDatePicker" placeholder="End Date" formControlName="hour_end">
          <mat-datepicker #endDatePicker></mat-datepicker>
        </mat-form-field>

        <!-- Heure de fin -->
        <mat-form-field>
          <input matInput [ngxTimepicker]="endTimePicker" placeholder="End Time" formControlName="hour_end">
          <ngx-material-timepicker #endTimePicker></ngx-material-timepicker>
        </mat-form-field>
      </div>
    </div>

    <div class="form-group">
      <label for="image">Image de l'événement</label>
      <input id="image" type="file" (change)="onFileSelected($event)" class="form-control" />
      <div *ngIf="selectedFileName" class="file-name">
        Fichier sélectionné: {{ selectedFileName }}
      </div>
    </div>

    <button type="submit" [disabled]="groupeForm.invalid" class="btn btn-primary">Créer l'événement</button>
  </form>
</div>
