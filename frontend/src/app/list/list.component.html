<app-toolbar></app-toolbar>
<div class="container">
    <h3>Suggestion</h3>
    <div class="row">
        <div class="col-md-12 list" *ngFor="let user of users">
            <div class="user">
                <div class="info-img">
                    <div class="img" style="width: 100px; height: 100px;">
                        <img src="https://material.angular.io/assets/img/examples/shiba2.jpg" alt="user" style="width: 100%; height: 100%;">
                    </div>
                    <div class="info">
                        <span>John DOE</span>
                        <span>Followers: 10 k</span>
                    </div>
                </div>
                <div class="buttons">
                    <button class="btn btn-warning">Follow</button>
                    <button class="btn btn-info" routerLink="/profile/1">Profile</button>
                </div>
            </div>
            <mat-divider></mat-divider>
        </div>
    </div>
</div>
