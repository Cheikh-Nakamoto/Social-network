@if(username != ""){
<mat-toolbar class="app-toolbar">
    <div class="toolbar-left">
        <a routerLink="/" class="logo">
            <img src="logo.png" height="60" alt="" />
            <span class="title">{{ title }}</span></a>
    </div>

    <div class="toolbar-center">
        <input matInput placeholder="Search..." />
    </div>

    <div class="toolbar-right">
        <button (click)="visibilityMessage()" [matBadgeHidden]="hiddenMessage"
            aria-label="Example icon-button with heart icon" class="example-icon" mat-icon-button matBadge="{{chatCount}}">
            <mat-icon>chat</mat-icon>
        </button>
        <button (click)="visibilityNotif()" [matMenuTriggerFor]="menu" [matBadgeHidden]="hiddenNotif"
            aria-label="Example icon-button with heart icon" class="example-icon" mat-icon-button
            matBadge="{{notifylength}}">
            <mat-icon>notifications</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
            <div class="notif" *ngFor="let notif of this.IsNotify.notif">
                <div class="notif" mat-menu-item>
                    <p> {{notif.message}}</p>
                    <div class="buttons" >
                        <button class="btn btn-success" routerLink="/accept/">
                            <span class="material-icons text-white">check_circle</span>
                            Accept
                        </button>
                        <button class="btn btn-danger" routerLink="r/decline/">
                            <span class="material-icons text-white">cancel</span>
                            Decline
                        </button>
                    </div>
                </div>
            </div>
        </mat-menu>
        <div class=" relative">
            <button [matMenuTriggerFor]="userMenu" class="user-menu-button">
                <div class="user-info">
                    <img src="female.svg" width="30" height="30" alt="profile" />
                    <span class="username">{{ username }}</span>
                </div>
            </button>
            <mat-menu #userMenu="matMenu">
                <button mat-menu-item>
                    <i class="icofont icofont-edit"><span class="name">Edit profile</span></i>
                </button>
                <button mat-menu-item (click)="handleLogout()">
                    <i class="icofont icofont-logout"><span class="name">Logout</span></i>
                </button>
            </mat-menu>
        </div>
    </div>
</mat-toolbar>

}
