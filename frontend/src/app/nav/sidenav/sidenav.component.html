<mat-drawer-container class="example-container">
  <mat-drawer mode="side" opened>
    <mat-list *ngFor="let item of menuItems" role="list">
      <mat-list-item role="listitem">
        <a matListItemTitle routerLink="{{ item.route }}" (click)="handleMenuItemClick(item, $event)">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.name }}</span>
        </a>
      </mat-list-item>  
    </mat-list>
  </mat-drawer>
