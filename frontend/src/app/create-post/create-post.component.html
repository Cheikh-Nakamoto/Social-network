<div class="container">
  <div class="header">
    <h1>Créer un Post</h1>
  </div>
  <form id="postForm" [formGroup]="Post" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Titre du Post:</label>
      <input type="text" id="title" formControlName="title" name="title" required>
    </div>
    <div class="form-group">
      <label for="content">Contenu du Post:</label>
      <textarea id="content" formControlName="content" name="content" rows="5" required></textarea>
    </div>
    <div class="form-group">
      <label for="image">Image du Post:</label>
      <input type="file" id="image" formControlName="image" name="image" accept="image/*">
    </div>
    <div class="form-group">
      <label for="categorie">categorie du Post:</label>
      <input type="text" id="categorie" formControlName="categories" name="categorie" required >
    </div>
    <div class="form-group">
      <section>
        <h3>nature du post</h3>
        <mat-button-toggle-group name="favoriteColor" aria-label="Favorite Color"
          [hideSingleSelectionIndicator]="hideSingleSelectionIndicator()">
          <mat-button-toggle value="public" >Public</mat-button-toggle>
          <mat-button-toggle value="private" >Private</mat-button-toggle>
        </mat-button-toggle-group>
      </section>
    </div>
    <div class="form-group">
      <button type="submit" >Publier</button>
    </div>
  </form>
