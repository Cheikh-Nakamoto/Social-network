<div class="posts" *ngFor="let post of posts">
  <mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <img routerLink="/profile/{{id}}" mat-card-avatar src="logo.png" width="64" height="64" alt="profile">
      <mat-card-title routerLink="/profile/{{id}}">{{ user.name }}</mat-card-title>
      <mat-card-subtitle routerLink="/profile/{{id}}">&#64;{{  AllUser[post.id].nickname}}</mat-card-subtitle>
    </mat-card-header>
    <img class="post-image" mat-card-image [src]="post.image" alt="Photo of a Shiba Inu">
    <mat-card-content>
      <p>{{ post.content }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-icon-button (click)="onLike(post.id, 'post')">
        <span>{{ likemap[post.id] }}</span>
        <mat-icon>thumb_up_outilne</mat-icon>
      </button>
      <button mat-icon-button (click)="onDislike(post.id,'post')">
        <span>{{ dislikemap[post.id]}}</span>
        <mat-icon>thumb_down</mat-icon>
      </button>
      <button mat-icon-button (click)="openDialog(post.id)">
        <span>{{comments.comments_by_post[post.id].length}}</span>
        <mat-icon>forum</mat-icon>
      </button>
      <span class="comment-form">
        <form (submit)="onComment(post.id,'comment', $event)">
          <input matInput placeholder="Comment" name="comment">
          <button class="send" mat-icon-button type="submit">
            <mat-icon>send</mat-icon>
          </button>
        </form>
      </span>
      <span class="spacer"></span>
      <!-- <button mat-icon-button>
                <span>{{ shares }}</span>
                <mat-icon>share</mat-icon>
            </button> -->
    </mat-card-actions>
    <!-- <div class="comments" *ngIf="comments.length > 0">

    </div> -->
  </mat-card>
</div>
